[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phb-agentledger"
version = "0.1.1"
description = "A tamper-evident, hash-chained audit ledger for AI agent actions."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PHB-Studio-Commercial"
license-files = ["LICENSE"]
authors = [{ name = "PHB Studio" }]
keywords = ["audit", "ledger", "ai-agents", "compliance", "tamper-evident", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = ["filelock>=3.12"]

[project.urls]
Homepage = "https://budrewicz.gumroad.com/l/PHB-AgentLedger"
"Commercial licence" = "https://budrewicz.gumroad.com/l/PHB-AgentLedger"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["agentledger"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["agentledger", "tests", "README.md", "LICENSE", "demo.py", "pyproject.toml"]
